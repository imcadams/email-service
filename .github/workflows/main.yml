name: CI/CD for Email Service

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build Lambda function
        run: npm run build

      - name: Run Lambda tests
        run: npm test

      - name: Install CDK dependencies
        working-directory: ./cdk_infra
        run: npm ci

      - name: Run CDK tests
        working-directory: ./cdk_infra
        run: npm test

      - name: Synthesize CDK stack
        working-directory: ./cdk_infra
        run: npx cdk synth

  deploy_prod:
    runs-on: ubuntu-latest
    needs: build_and_test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    env:
      AWS_REGION: us-east-1
      AWS_DEPLOY_ROLE_ARN: arn:aws:iam::957356740227:role/EmailService-GitHubActionsDeployRole-EmailServiceStack
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build Lambda function
        run: npm run build

      - name: Install CDK dependencies
        working-directory: ./cdk_infra
        run: npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CDK Stack to Production
        working-directory: ./cdk_infra
        run: npx cdk deploy EmailServiceStack --require-approval never --outputs-file cdk-outputs.json

      - name: Upload CDK outputs
        uses: actions/upload-artifact@v4
        with:
          name: cdk-outputs
          path: ./cdk_infra/cdk-outputs.json
